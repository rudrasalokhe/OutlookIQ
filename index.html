<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OutlookIQ — Agentic RAG Platform (Pinecone & LangGraph)</title>

    <!-- Font Awesome 6 Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <!-- Chart.js via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

    <!-- Global Client Error Logger & Visual Fallback -->
    <script>
        function showFatalError(title, err) {
            console.error("CLIENT GLOBAL ERROR:", err);
            const m = document.getElementById("main-content");
            if (m && (!m.innerHTML || m.innerHTML.trim() === "" || m.innerHTML.includes("Loading live"))) {
                m.innerHTML = '<div class="brutal-card bg-pink" style="margin: 40px; padding: 24px; border: 3px solid #000; box-shadow: 6px 6px 0px #000;">' +
                    '<h2 style="text-transform: uppercase; font-size: 1.3rem; margin-bottom: 8px;">Terminal Runtime Notice: ' + title + '</h2>' +
                    '<p style="font-weight: 700; margin-bottom: 12px;">' + (err.message || String(err)) + '</p>' +
                    '<pre style="background: #fff; padding: 12px; border: 2px solid #000; font-size: 0.8rem; overflow-x: auto; max-height: 200px;">' + (err.stack || String(err)) + '</pre>' +
                    '<div style="margin-top: 16px; display: flex; gap: 10px;">' +
                        '<a href="#landing" class="brutal-btn" style="background: var(--main-yellow);">Go to Landing Page</a>' +
                        '<button onclick="location.reload()" class="brutal-btn" style="background: #fff;">Force Hard Reload</button>' +
                    '</div>' +
                '</div>';
            }
        }
        window.addEventListener("error", function(e) {
            showFatalError("Script Exception", e.error || e.message);
        });
        window.addEventListener("unhandledrejection", function(e) {
            showFatalError("Promise Rejection", e.reason);
        });
    </script>

    <!-- UI Engineer's Neo-Brutalist Design System Embedded Directly -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap');

        :root {
            --bg-color: #f4f4f0;
            --main-yellow: #fde047;
            --main-pink: #f9a8d4;
            --main-teal: #5eead4;
            --border-color: #171717;
            --border-width: 3px;
            --shadow-offset: 6px;
            --font-sans: 'Space Grotesk', system-ui, -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-color);
            color: #000;
            display: flex;
            height: 100vh;
            width: 100vw;
            max-width: 100vw;
            overflow-x: hidden;
            overflow-y: hidden;
        }

        /* Brutalist Utilities */
        .brutal-border {
            border: var(--border-width) solid var(--border-color);
        }

        .brutal-shadow {
            box-shadow: var(--shadow-offset) var(--shadow-offset) 0px var(--border-color);
        }

        .brutal-card {
            background: #fff;
            border: var(--border-width) solid var(--border-color);
            box-shadow: var(--shadow-offset) var(--shadow-offset) 0px var(--border-color);
            padding: 24px;
            display: flex;
            flex-direction: column;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        .brutal-btn {
            background: #fff;
            border: var(--border-width) solid var(--border-color);
            box-shadow: 4px 4px 0px var(--border-color);
            padding: 10px 16px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.8rem;
            color: #000;
            text-decoration: none;
            transition: all 0.1s;
        }

        .brutal-btn:hover {
            background: var(--main-yellow);
        }

        .brutal-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--border-color);
        }

        .bg-yellow { background-color: var(--main-yellow) !important; }
        .bg-pink { background-color: var(--main-pink) !important; }
        .bg-teal { background-color: var(--main-teal) !important; }

        /* Sidebar Layout */
        .sidebar {
            width: 280px;
            background: #fff;
            border-right: var(--border-width) solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 10;
            height: 100vh;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .logo-area {
            padding: 24px;
            background: var(--main-yellow);
            border-bottom: var(--border-width) solid var(--border-color);
            font-weight: 700;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: -1px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            background: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            font-weight: 700;
            border: 2px solid #000;
        }

        .nav-group {
            padding: 20px 24px 10px;
            font-size: 0.8rem;
            font-weight: 700;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-links {
            list-style: none;
            padding: 0 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nav-item {
            display: block;
            padding: 12px 16px;
            border: 2px solid transparent;
            font-weight: 700;
            text-decoration: none;
            color: #000;
            text-transform: uppercase;
            font-size: 0.85rem;
            transition: all 0.15s;
        }

        .nav-item.active {
            background: #000 !important;
            color: #fff !important;
            border-color: #000 !important;
            box-shadow: 4px 4px 0px var(--border-color);
        }

        .nav-item:hover:not(.active) {
            border-color: var(--border-color);
            box-shadow: 3px 3px 0px var(--border-color);
            background: #fff;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 40px;
            background-color: var(--bg-color);
            height: 100vh;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px dashed var(--border-color);
            gap: 16px;
            flex-wrap: wrap;
        }

        .header-title h1 {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: -2px;
            line-height: 1;
            margin-bottom: 10px;
        }

        .badge {
            background: var(--main-yellow);
            padding: 4px 12px;
            border: 2px solid var(--border-color);
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            display: inline-block;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        /* Dashboard Grid */
        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            margin-bottom: 24px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-bottom: 24px;
        }

        @media (max-width: 1200px) {
            .grid-4 { grid-template-columns: repeat(2, 1fr); }
            .grid-3 { grid-template-columns: 1fr; }
        }

        @media (max-width: 768px) {
            body { flex-direction: column; height: auto; overflow: auto; }
            .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 3px solid #000; }
            .grid-4 { grid-template-columns: 1fr; }
            .main-content { padding: 20px; }
        }

        /* Card Internals */
        .stat-label {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
        }

        .stat-value {
            font-size: 3rem;
            font-weight: 700;
            line-height: 1;
            display: flex;
            align-items: center;
        }

        .stat-trend {
            display: inline-block;
            padding: 4px 8px;
            border: 2px solid var(--border-color);
            font-size: 0.8rem;
            font-weight: 700;
            background: #fff;
            margin-left: 12px;
            vertical-align: middle;
        }

        /* Simple Bar Chart CSS Representation */
        .chart-container {
            display: flex;
            align-items: flex-end;
            gap: 16px;
            height: 120px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px dashed var(--border-color);
        }

        .bar-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 100%;
            gap: 8px;
        }

        .bar {
            width: 100%;
            border: 2px solid var(--border-color);
            transition: height 0.3s ease;
        }
        
        .bar-label {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .brutal-select {
            background: #fff;
            border: var(--border-width) solid var(--border-color);
            box-shadow: 4px 4px 0px var(--border-color);
            padding: 10px 16px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.8rem;
            outline: none;
        }

        .brutal-table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border: var(--border-width) solid var(--border-color);
            box-shadow: var(--shadow-offset) var(--shadow-offset) 0px var(--border-color);
        }

        .brutal-table th {
            background: var(--main-yellow);
            padding: 14px 18px;
            text-align: left;
            border-bottom: var(--border-width) solid var(--border-color);
            border-right: 2px solid var(--border-color);
            text-transform: uppercase;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }

        .brutal-table td {
            padding: 14px 18px;
            border-bottom: 2px solid var(--border-color);
            border-right: 2px solid var(--border-color);
            font-size: 0.85rem;
        }

        .brutal-table tr:hover td {
            background: #fdfae7;
        }

        .evidence-drawer-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .evidence-drawer-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }

        .evidence-drawer {
            position: fixed;
            top: 0;
            right: 0;
            width: 540px;
            max-width: 92vw;
            height: 100vh;
            background: #fff;
            border-left: var(--border-width) solid var(--border-color);
            box-shadow: -8px 0px 0px rgba(0,0,0,0.25);
            z-index: 60;
            transform: translateX(105%);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
        }

        .evidence-drawer.open {
            transform: translateX(0);
        }

        #toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
            max-width: 400px;
        }

        #toast-container .brutal-card {
            pointer-events: auto;
        }

        /* Helpers */
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .flex-1 { flex: 1; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .gap-2 { gap: 8px; }
        .gap-3 { gap: 12px; }
        .gap-4 { gap: 16px; }
        .hidden { display: none !important; }
        .relative { position: relative; }
        .cursor-pointer { cursor: pointer; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar" id="app-sidebar">
        <div class="logo-area" style="flex-direction: column; align-items: flex-start; gap: 4px;">
            <div style="display: flex; align-items: center; gap: 8px;">
                <div class="logo-icon">OQ</div>
                OutlookIQ
            </div>
            <span class="badge" style="background: var(--main-teal); font-size: 0.62rem; padding: 2px 6px; letter-spacing: 0.5px; font-weight: 700; border: 1px solid #000;">LANGGRAPH · PINECONE</span>
        </div>
        
        <div class="nav-group">Dashboards</div>
        <ul class="nav-links">
            <li><a href="#overview" class="nav-item active" id="nav-overview">Overview</a></li>
            <li><a href="#companies" class="nav-item" id="nav-companies">Companies</a></li>
            <li><a href="#promises" class="nav-item" id="nav-promises">Tracker</a></li>
            <li><a href="#analytics" class="nav-item" id="nav-analytics">Analytics</a></li>
        </ul>

        <div class="nav-group">Research Tools</div>
        <ul class="nav-links">
            <li><a href="#comparison" class="nav-item" id="nav-comparison">Compare Firms</a></li>
            <li><a href="#documents" class="nav-item" id="nav-documents">Documents</a></li>
            <li><a href="#analyst" class="nav-item" id="nav-analyst">AI Analyst</a></li>
            <li><a href="#methodology" class="nav-item" id="nav-methodology">Methodology</a></li>
            <li><a href="#profile" class="nav-item" id="nav-profile">Profile & MongoDB</a></li>
        </ul>
        
        <div style="margin-top: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px;">
            <a href="#profile" style="text-decoration: none; color: inherit; display: block;">
                <div class="brutal-card bg-yellow" style="padding: 14px; cursor: pointer;">
                    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px;">
                        <div id="sidebar-user-avatar" style="width: 32px; height: 32px; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem; border: 2px solid #000;">RS</div>
                        <div>
                            <div id="sidebar-user-name" style="font-weight: 700; font-size: 0.85rem; text-transform: uppercase;">Rudra Salokhe</div>
                            <div id="sidebar-user-role" style="font-size: 0.7rem; font-weight: 600; color: #333;">Lead Quant Strategist</div>
                        </div>
                    </div>
                    <div style="font-size: 0.7rem; font-weight: 700; text-transform: uppercase; border-top: 2px dashed var(--border-color); padding-top: 6px; display: flex; justify-content: space-between;">
                        <span>MongoDB Integration</span>
                        <span style="background: var(--main-teal); padding: 1px 4px;">Config &rarr;</span>
                    </div>
                </div>
            </a>
            <button id="btn-sidebar-logout" class="brutal-btn" style="justify-content: center; background: #fee; color: #900; font-size: 0.75rem; padding: 10px; cursor: pointer; width: 100%;">
                <i class="fas fa-sign-out-alt"></i> Sign Out
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="main-content" role="main">
        <!-- Rendered dynamically by SPA router -->
    </main>

    <!-- Global Evidence Drawer Container -->
    <div class="evidence-drawer-backdrop" id="evidence-drawer-backdrop"></div>
    <div class="evidence-drawer" id="evidence-drawer"></div>

    <!-- Bootstrapping Script -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
